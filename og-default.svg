  <!-- Starfield — 40 scattered dots -->
  <g fill="#fff5d8" opacity="0.75">
    <circle cx="120" cy="90"  r="1.2"/><circle cx="260" cy="180" r="1.8"/><circle cx="380" cy="60"  r="1.0"/>
    <circle cx="520" cy="140" r="1.4"/><circle cx="640" cy="80"  r="1.6"/><circle cx="800" cy="160" r="1.0"/>
    <circle cx="940" cy="70"  r="1.8"/><circle cx="1080" cy="140" r="1.2"/><circle cx="60"  cy="210" r="1.3"/>
    <circle cx="190" cy="320" r="1.1"/><circle cx="310" cy="440" r="1.5"/><circle cx="450" cy="520" r="1.0"/>
    <circle cx="590" cy="560" r="1.6"/><circle cx="720" cy="500" r="1.1"/><circle cx="860" cy="550" r="1.3"/>
    <circle cx="1000" cy="440" r="1.2"/><circle cx="1130" cy="520" r="1.5"/><circle cx="80"  cy="570" r="1.1"/>
    <circle cx="210" cy="600" r="0.9"/><circle cx="350" cy="240" r="0.8"/><circle cx="480" cy="380" r="1.0"/>
    <circle cx="620" cy="240" r="0.8"/><circle cx="780" cy="380" r="1.2"/><circle cx="900" cy="300" r="0.9"/>
    <circle cx="1060" cy="300" r="1.0"/>
