      <stop offset="0%" stop-color="#1a1420"/>
      <stop offset="55%" stop-color="#0a080f"/>
      <stop offset="100%" stop-color="#020104"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8843a"/>
      <stop offset="50%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#a8843a"/>
