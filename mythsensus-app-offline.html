<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythsensus — Daily Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040407;--bg2:#0a0a10;--bg3:#0d0d15;
  --gold:#c8a45a;--gold2:#e8c87a;--gold3:#a8843a;
  --text:#e6e2d8;--muted:#9a8a72;--border:#1a1a28;
  --green:#4aba50;--blue:#6090c0;--red:#ff6060;--purple:#b070e0;
  --fire:#e06040;--earth:#60a060;--air:#a0b040;--water:#4080c0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;overflow-x:hidden;}
header{text-align:center;padding:28px 20px 0;position:relative;}
.logo{font-family:'Cinzel Decorative',serif;font-size:clamp(18px,4vw,30px);color:var(--gold);letter-spacing:6px;}
.tagline{font-family:'Josefin Sans',sans-serif;font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:4px;}
.date-display{font-family:'Josefin Sans',sans-serif;font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:1px;}
.logo-offline-badge{display:inline-block;font-family:'Josefin Sans',sans-serif;font-size:8px;letter-spacing:2px;padding:2px 8px;background:rgba(200,164,90,.1);border:1px solid var(--gold3);color:var(--gold3);border-radius:2px;margin-left:8px;vertical-align:middle;}
</style>
</head>
<body><header><div class="logo">MYTHSENSUS <span class="logo-offline-badge">OFFLINE</span></div></header>
<main style="max-width:820px;margin:0 auto;padding:40px 14px;text-align:center;">
<p style="font-family:'Josefin Sans',sans-serif;font-size:11px;color:#9a8a72;letter-spacing:2px;margin-bottom:20px;">OFFLINE VERSION — FULL APP LOADING</p>
<p style="font-family:'Cormorant Garamond',serif;font-size:16px;color:#e6e2d8;">This is the Mythsensus Daily Oracle offline app.</p>
</main>
</body>
</html>
