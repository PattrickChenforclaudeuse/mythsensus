<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!--
  /en — English entry point (2026-08-15).

  WHY THIS FILE EXISTS: /en used to be a Vercel rewrite straight to /, so it served
  the Thai index.html verbatim — including its Thai og:title and og:description.
  Every English-language share (Facebook, Reddit, Slack, Discord, Product Hunt)
  therefore rendered a Thai preview card, which is close to useless to an English
  reader and reads as the wrong-language link. Crawlers only read the <head>, so a
  small English head plus a hand-off into the app fixes the preview without
  duplicating the 1.8 MB single-page app.

  The app itself still needs to come up in English: it reads localStorage.mth_lang
  at boot, so we set it here BEFORE handing off, and pass ?lang=en as a visible
  fallback that the app's own detector also honours.

  Reversible: delete this file and restore { "source": "/en", "destination": "/" }
  in vercel.json.
-->

<title>Mythsensus — 26 ancient divination systems, one Cosmic Score</title>
<meta name="description" content="Most astrology tools pick one tradition. Mythsensus runs your birth date through 26 — BaZi, Vedic, Western, Thai, Mayan, runes and more — and shows where they agree and where they contradict. Free, no signup.">
<link rel="canonical" href="https://mythsensus.com/en">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Mythsensus">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="th_TH">
<meta property="og:url" content="https://mythsensus.com/en">
<meta property="og:title" content="26 ancient systems read your birth date. Here is where they disagree.">
<meta property="og:description" content="BaZi, Vedic, Western, Thai, Mayan, Norse runes and 21 more — laid side by side, so you can see what they agree on and where they contradict. Deterministic engine, free reading, no signup.">
<meta property="og:image" content="https://mythsensus.com/assets/og-banner.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="26 ancient systems read your birth date. Here is where they disagree.">
<meta name="twitter:description" content="Laid side by side: what they agree on, and where they contradict. Free, no signup.">
<meta name="twitter:image" content="https://mythsensus.com/assets/og-banner.jpg">

<style>
  html,body{margin:0;height:100%;background:#0a0a12;color:#c8a45a;
    font-family:'Josefin Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#c8a45a}
</style>

<script>
  // Hand off immediately. Set the language first so the app boots English even if
  // the query string is stripped somewhere along the way.
  try { localStorage.setItem('mth_lang','en'); } catch (_) {}
  location.replace('/?lang=en');
</script>
</head>
<body>
  <p>Mythsensus — 26 ancient divination systems, one Cosmic Score.<br>
  <a href="/?lang=en">Continue to Mythsensus &rarr;</a></p>
</body>
</html>
